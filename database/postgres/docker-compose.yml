services:
  db-cinema:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinema-spring
    container_name: cinema_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gestion_cinema
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./script:/docker-entrypoint-initdb.d:ro